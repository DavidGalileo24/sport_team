<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - San Salvador FC</title>
    <base href="../../">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="assets/images/sansalvador.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="bg-light">
    <!--Menu-->
    <div id="header"></div>

    <header class="hero-club text-center mb-5">
        <div class="container">
            <h1 class="display-3 fw-bold">Tienda</h1>
            <p class="lead" style="font-family: 'Dancing Script', cursive; font-size: 2rem; color: #3b82f6;">
                Historia, Orgullo y Pasión</p>
        </div>
    </header>

    <div class="container">
        <!-- Products -->
        <div id="product-list" class="row gy-4"></div>
    </div>
    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        //Cargar el header
        document.addEventListener("DOMContentLoaded", function () {
            fetch("src/layout/header.html")
                .then(r => r.text())
                .then(data => {
                    document.getElementById("header").innerHTML = data;
                    setupMobileMenu();
                    activateCurrentNavLink();
                });
            fetch("src/layout/footer.html")
                .then(r => r.text())
                .then(data => {
                    document.getElementById("footer").innerHTML = data;
                });
        });

        function activateCurrentNavLink() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.nav-link').forEach(link => {
                const linkPath = new URL(link.href, window.location.origin).pathname;
                if (linkPath === currentPath || (currentPath === '/' && linkPath === '/index.html')) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });
        }

        function setupMobileMenu() {
            const button = document.querySelector('#mobile-menu-button');
            const menu = document.getElementById('mobile-menu');
            if (!button || !menu) return;

            button.addEventListener('click', function () {
                const isHidden = menu.classList.toggle('hidden');
                menu.classList.toggle('block', !isHidden);
                button.setAttribute('aria-expanded', String(!isHidden));
            });
        }

        // Products
        const products = [
            {
                id: 1,
                name: 'Camiseta Local 2026',
                team: 'San Salvador FC',
                price: 29.99,
                img: 'assets/images/shirt1.jpeg',
                sizes: ['S', 'M', 'L', 'XL']
            },
            {
                id: 2,
                name: 'Camiseta aficionado 2026',
                team: 'San Salvador FC',
                price: 34.99,
                img: 'assets/images/shirt2.webp',
                sizes: ['S', 'M', 'L', 'XL']
            },
            {
                id: 3,
                name: 'Camiseta Alternativa',
                team: 'Alianza FC',
                price: 24.99,
                img: 'assets/images/uniforme1.jpg',
                sizes: ['S', 'M', 'L']
            },
            {
                id: 4,
                name: 'Camiseta Retro',
                team: 'Alianza FC',
                price: 24.99,
                img: 'assets/images/uniforme2.jpeg',
                sizes: ['S', 'M', 'L']
            },
            {
                id: 5,
                name: 'Camiseta Portero',
                team: 'Alianza FC',
                price: 24.99,
                img: 'assets/images/uniforme3.jpg',
                sizes: ['S', 'M', 'L']
            }
        ];

        function renderProducts(filter = '') {
            const container = document.getElementById('product-list');
            const q = filter.trim().toLowerCase();
            const filtered = products.filter(p => (p.name + ' ' + p.team).toLowerCase().includes(q));
            if (!container) return;
            container.innerHTML = filtered.map(p => `
                <div class="col-12 col-sm-6 col-md-4">
                    <div class="card h-100 shadow-sm">
                        <img src="${p.img}" class="card-img-top" alt="${p.name}" style="object-fit:cover;height:220px;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${p.name}</h5>
                            <p class="card-text text-muted small mb-2">${p.team}</p>
                            <p class="fw-bold mb-3">$${p.price.toFixed(2)}</p>
                            <div class="mt-auto">
                                <div class="d-flex justify-content-between align-items-center">
                                    <select class="form-select form-select-sm w-50" aria-label="Talla">
                                        ${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
                                    </select>
                                    <button class="btn btn-primary btn-sm add-to-cart" data-id="${p.id}">Añadir</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            container.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = Number(btn.getAttribute('data-id'));
                    const product = products.find(x => x.id === id);
                    alert(`Añadido al carrito: ${product.name} - $${product.price.toFixed(2)}`);
                });
            });
        }
        document.addEventListener('DOMContentLoaded', function () {
            renderProducts();
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            if (searchBtn && searchInput) {
                searchBtn.addEventListener('click', () => renderProducts(searchInput.value));
                searchInput.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter') renderProducts(searchInput.value);
                });
            }
        });
    </script>
</body>

</html>
